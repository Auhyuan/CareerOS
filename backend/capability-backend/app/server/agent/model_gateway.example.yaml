defaults:
  chat: chat_main
  embedding: embed_search
  rerank: rerank_default

models:
  chat_main:
    kind: llm
    provider: openai_compatible
    base_url: https://your-model-gateway.example.com
    model: chat_main
    api_key: your_model_api_key
    timeout: 360

  intent_router:
    kind: llm
    provider: openai_compatible
    base_url: https://your-model-gateway.example.com
    model: intent_router
    api_key: your_model_api_key
    timeout: 360

  guard:
    kind: llm
    provider: openai_compatible
    base_url: https://your-model-gateway.example.com
    model: guard
    api_key: your_model_api_key
    timeout: 360

  embed_search:
    kind: embedding
    provider: openai_compatible
    base_url: https://your-model-gateway.example.com
    model: embedding
    api_key: your_model_api_key
    timeout: 360
    dimension: 1024

  rerank_default:
    kind: reranker
    provider: http_reranker
    base_url: https://your-model-gateway.example.com/rerank
    model: reranker
    api_key: your_model_api_key
    timeout: 360
